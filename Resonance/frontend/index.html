<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance - Music NFT Platform</title>
    
    <!-- Google Fonts - JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- ethers.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    
    <style>
        /* ============ RESET & BASE =========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #1a1a1a;
            --accent: #00ff88;
            --white: #ffffff;
            --muted: #555555;
            --danger: #ff003c;
            --success: #00ff88;
            --font: 'JetBrains Mono', 'Space Mono', monospace;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--white);
            font-size: 0.875rem;
            line-height: 1.7;
            overflow-x: hidden;
        }
        
        /* ============ NAVBAR =========== */
        nav.fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--bg);
            border-bottom: 1px solid var(--accent);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.08em;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.8);
        }
        
        .cursor {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        .nav-links a {
            color: var(--white);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            transition: color 0s;
        }
        
        .nav-links a:hover {
            color: var(--accent);
        }
        
        .nav-links .divider {
            color: var(--muted);
            font-size: 0.75rem;
        }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        #walletStatus {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.08em;
        }
        
        #connectBtn {
            background: var(--bg);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 20px;
            font-family: var(--font);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: none;
        }
        
        #connectBtn:hover {
            background: var(--accent);
            color: var(--bg);
        }
        
        #connectBtn:active {
            transform: scale(0.98);
        }
        
        /* ============ MAIN CONTENT =========== */
        #content {
            margin-top: 60px;
            min-height: calc(100vh - 60px);
            padding: 40px 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* ============ HERO (HOME) =========== */
        .hero {
            min-height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }
        
        /* Scan line overlay */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                transparent,
                transparent 3px,
                rgba(0, 0, 0, 0.03) 3px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
        }
        
        .hero h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.8);
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        
        .hero p {
            font-size: 0.875rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }
        
        .hero .cursor-block {
            display: inline-block;
            width: 12px;
            height: 3px;
            background: var(--accent);
            margin-top: 20px;
            animation: blink 1s infinite;
        }
        
        /* ============ CARDS =========== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            padding: 24px;
            transition: none;
        }
        
        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.08);
        }
        
        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--white);
        }
        
        .card p {
            color: var(--muted);
            font-size: 0.875rem;
            margin-bottom: 16px;
        }
        
        .card button {
            background: var(--bg);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            font-family: var(--font);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: none;
        }
        
        .card button:hover {
            background: var(--accent);
            color: var(--bg);
        }
        
        /* ============ FORM ELEMENTS =========== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        label {
            display: block;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 6px;
        }
        
        input[type="text"],
        input[type="number"],
        textarea {
            background: var(--bg);
            border: 1px solid #333;
            color: var(--white);
            font-family: var(--font);
            font-size: 0.875rem;
            padding: 10px 14px;
            width: 100%;
            transition: none;
        }
        
        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 6px rgba(0, 255, 136, 0.2);
        }
        
        input::placeholder,
        textarea::placeholder {
            color: #444;
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        input[type="file"] {
            background: var(--bg);
            border: 1px dashed #333;
            color: var(--muted);
            font-family: var(--font);
            font-size: 0.875rem;
            padding: 10px 14px;
            width: 100%;
            cursor: pointer;
        }
        
        input[type="file"]:hover {
            border-color: var(--accent);
        }
        
        input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--accent);
        }
        
        /* ============ BUTTONS =========== */
        .btn-primary {
            background: var(--bg);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 24px;
            font-family: var(--font);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: none;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: var(--accent);
            color: var(--bg);
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* ============ STATUS MESSAGES =========== */
        .status {
            font-family: var(--font);
            font-size: 0.875rem;
            margin-top: 12px;
        }
        
        .status.success {
            color: var(--success);
        }
        
        .status.error {
            color: var(--danger);
        }
        
        /* ============ HEADINGS =========== */
        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--white);
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }
        
        /* ============ FOOTER =========== */
        footer {
            border-top: 1px solid var(--border);
            padding: 20px 24px;
            background: var(--bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #333;
            max-width: 1200px;
            margin: 40px auto 0;
        }
        
        footer .left {
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        footer .center {
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        footer .right {
            font-family: var(--font);
            font-size: 0.75rem;
        }
        
        footer .contract-link {
            color: #333;
            cursor: pointer;
            transition: color 0s;
        }
        
        footer .contract-link:hover {
            color: var(--accent);
        }
        
        /* ============ PAGE SPECIFIC =========== */
        .balance-display {
            font-family: var(--font);
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 20px;
        }
        
        .balance-display span {
            color: var(--accent);
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid;
            margin-left: 8px;
        }
        
        .badge.public {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .badge.private {
            border-color: var(--muted);
            color: var(--muted);
        }
        
        .guild-card {
            margin-bottom: 10px;
        }
        
        .guild-card h4 {
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .guild-card p {
            color: var(--muted);
            font-size: 0.875rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="fixed">
        <div class="logo">RESONANCE<span class="cursor">|</span></div>
        <div class="nav-links">
            <a href="#" onclick="showPage('home')">HOME</a>
            <span class="divider">/</span>
            <a href="#" onclick="showPage('mint')">MINT</a>
            <span class="divider">/</span>
            <a href="#" onclick="showPage('playlists')">PLAYLISTS</a>
            <span class="divider">/</span>
            <a href="#" onclick="showPage('guilds')">GUILDS</a>
            <span class="divider">/</span>
            <a href="#" onclick="showPage('treasury')">TREASURY</a>
        </div>
        <div class="nav-right">
            <span id="walletStatus"></span>
            <button id="connectBtn" onclick="connectWallet()">CONNECT WALLET</button>
        </div>
    </nav>
    
    <!-- MAIN CONTENT -->
    <div id="content"></div>
    
    <!-- FOOTER -->
    <footer>
        <div class="left">RESONANCE // BUILT ON HELA BLOCKCHAIN</div>
        <div class="center">© 2025 // ALL RIGHTS RESERVED</div>
        <div class="right">
            <span class="contract-link" onclick="copyText(CONTRACT_ADDRESSES.musicNFT)">NFT: 0x0000...0000</span>
        </div>
    </footer>
    
    <!-- APP LOGIC -->
    <script src="app.js"></script>
</body>
</html>
